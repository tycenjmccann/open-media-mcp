name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - name: cdk synth (no AWS account needed; AZs given as context)
        run: npx cdk synth -q -c 'availability-zones:account=111111111111:region=us-east-1=["us-east-1a","us-east-1b","us-east-1c"]'
        env:
          CDK_DEFAULT_ACCOUNT: "111111111111"
          CDK_DEFAULT_REGION: us-east-1
      - run: pip install pytest boto3
      - run: python -m pytest -q tests
